services:
  - type: web
    name: portfolio-returns-viz
    env: python
    pythonVersion: 3.12
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run src/portfolio_viz/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
